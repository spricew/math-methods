<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
    <!-- Identidad: mismo azul del logotipo -->
    <rect width="128" height="128" rx="28" fill="#137fec"/>

    <!-- Eje x translúcido -->
    <path d="M20 64h88" stroke="#fff" stroke-opacity=".4" stroke-width="6" stroke-linecap="round"/>

    <!-- Curva f(x) que cruza el eje exactamente en (66, 64) -->
    <path d="M28 100 C 60 96, 72 32, 104 28" fill="none" stroke="#fff" stroke-width="11" stroke-linecap="round"/>

    <!-- Raíz encontrada -->
    <circle cx="66" cy="64" r="10" fill="#F7BE26" stroke="#137fec" stroke-width="5"/>
</svg>
